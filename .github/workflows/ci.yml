name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          # Windows 只做代码验证，不发二进制；-race 在 Windows 需要 C 工具链，见下方步骤。
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化，请在本地运行 gofmt -w ."
            echo "$unformatted"
            exit 1
          fi

      - name: Verify go.mod is tidy
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        # 用 bash 而不是 Windows 默认的 pwsh：pwsh 下 -coverprofile=coverage.out
        # 会被拆出一个多余的 .out 包参数（FAIL .out [setup failed]）。
        shell: bash
        run: go test -short -count=1 -coverprofile=coverage.out ./...

      - name: Coverage summary
        shell: bash
        run: go tool cover -func=coverage.out | tail -1

      - name: Unit tests with race detector
        # Go 的竞态检测器需要 cgo + C 编译器；Windows 镜像不一定带 gcc。
        # 没有编译器时显式跳过并打出 notice（不静默降级），三平台共用同一条命令。
        shell: bash
        run: |
          if ! command -v gcc >/dev/null 2>&1 && ! command -v clang >/dev/null 2>&1; then
            echo "::notice::未找到 C 编译器，跳过 -race（竞态检测器需要 cgo）"
            exit 0
          fi
          go test -short -count=1 -race ./...

      - name: E2E tests (real binary + HTTP + hot reload)
        run: go test -count=1 -run TestE2E ./...
