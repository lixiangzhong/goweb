# GoReleaser 配置（v2 schema）。
# 推 v* 标签时由 .github/workflows/release.yml 调用，产出 macOS / Linux 的
# amd64 + arm64 二进制并发布 GitHub Release。
# 本地验证：goreleaser build --snapshot --clean
version: 2

project_name: goweb

before:
  hooks:
    - go mod tidy

builds:
  - id: goweb
    main: .
    binary: goweb
    # 纯 Go 实现，无需 cgo，交叉编译即可产出全部目标。
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    # Windows 只发 amd64：CI 里只验证了 windows/amd64，arm64 从未测过。
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: goweb
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
    # Windows 用户习惯 zip 解压即用，单独覆盖归档格式。
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

release:
  draft: false
  prerelease: auto
